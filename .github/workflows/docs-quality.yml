name: Docs quality

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  verify-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify documentation structure and links
        shell: pwsh
        run: ./scripts/Verify-Docs.ps1

      - name: Test documentation verifier regressions
        shell: pwsh
        run: ./scripts/Test-VerifyDocs.ps1
